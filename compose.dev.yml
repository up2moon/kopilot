services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-kopilot-local-compose-secret}
      OPEN_AI_KEY: ${OPEN_AI_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MYDATA_TRANSACTION_SOURCE: ${MYDATA_TRANSACTION_SOURCE:-openai}
      CUST_ID: ${CUST_ID:-}
      AUTH_KEY: ${AUTH_KEY:-}
      KOSCOM_SYNC_DISABLED: ${KOSCOM_SYNC_DISABLED:-false}
      KOSCOM_LIVE_REFRESH_ON_READ: ${KOSCOM_LIVE_REFRESH_ON_READ:-true}
      KOSCOM_MASTER_SYNC_ON_READ: ${KOSCOM_MASTER_SYNC_ON_READ:-true}
      KOSCOM_PRICE_SYNC_ALL_ASSETS: ${KOSCOM_PRICE_SYNC_ALL_ASSETS:-false}
      KOSCOM_BASE_PRICE_BACKFILL_MONTHS: ${KOSCOM_BASE_PRICE_BACKFILL_MONTHS:-3}
      KOSCOM_BASE_PRICE_SYNC_LIMIT: ${KOSCOM_BASE_PRICE_SYNC_LIMIT:-50}
      KOSCOM_BASE_PRICE_SYNC_ALL_ASSETS: ${KOSCOM_BASE_PRICE_SYNC_ALL_ASSETS:-false}
      KOSCOM_MISSING_BASE_PRICE_SYNC_INTERVAL_MS: ${KOSCOM_MISSING_BASE_PRICE_SYNC_INTERVAL_MS:-600000}
      KOSCOM_MISSING_BASE_PRICE_SYNC_LIMIT: ${KOSCOM_MISSING_BASE_PRICE_SYNC_LIMIT:-60}
      DB_SYNC_SCHEMA: ${DB_SYNC_SCHEMA:-true}
      DB_SYNC_ALTER: ${DB_SYNC_ALTER:-true}
    command: sh -c "npm install && npm run dev"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
