services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: kopilot-frontend

    ports:
      - "80:80"

    restart: unless-stopped

    environment:
      BACKEND_ALB_HOST: ${BACKEND_ALB_HOST}
      NGINX_ENVSUBST_FILTER: BACKEND_ALB_HOST

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

    profiles:
      - web

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kopilot-backend

    ports:
      - "3000:3000"

    restart: unless-stopped

    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      SAVING_BOT_CHAT_TTL_SECONDS: ${SAVING_BOT_CHAT_TTL_SECONDS:-259200}
      SAVING_BOT_CHAT_MAX_MESSAGES: ${SAVING_BOT_CHAT_MAX_MESSAGES:-100}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPEN_AI_KEY: ${OPEN_AI_KEY:?OPEN_AI_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_SAVING_VECTOR_STORE_ID: ${OPENAI_SAVING_VECTOR_STORE_ID:?OPENAI_SAVING_VECTOR_STORE_ID is required}
      SAVING_BOT_TRANSACTION_JSON_PATH: /app/data/payment_transactions_dummy_30.json
      CUST_ID: ${CUST_ID:?CUST_ID is required}
      AUTH_KEY: ${AUTH_KEY:?AUTH_KEY is required}
      CHECK_API_ENABLED: ${CHECK_API_ENABLED:-true}
      KOSCOM_SYNC_DISABLED: ${KOSCOM_SYNC_DISABLED:-false}
      KOSCOM_MASTER_SYNC_ON_READ: ${KOSCOM_MASTER_SYNC_ON_READ:-true}
      KOSCOM_DB_LOCK_TIMEOUT_SECONDS: ${KOSCOM_DB_LOCK_TIMEOUT_SECONDS:-10}
      INVESTMENT_DEBUG_ERRORS: ${INVESTMENT_DEBUG_ERRORS:-false}
      KOSCOM_PRICE_SYNC_ALL_ASSETS: ${KOSCOM_PRICE_SYNC_ALL_ASSETS:-false}
      KOSCOM_BASE_PRICE_BACKFILL_MONTHS: ${KOSCOM_BASE_PRICE_BACKFILL_MONTHS:-3}
      KOSCOM_BASE_PRICE_SYNC_LIMIT: ${KOSCOM_BASE_PRICE_SYNC_LIMIT:-50}
      KOSCOM_BASE_PRICE_SYNC_ALL_ASSETS: ${KOSCOM_BASE_PRICE_SYNC_ALL_ASSETS:-false}
      KOSCOM_MISSING_BASE_PRICE_SYNC_INTERVAL_MS: ${KOSCOM_MISSING_BASE_PRICE_SYNC_INTERVAL_MS:-600000}
      KOSCOM_MISSING_BASE_PRICE_SYNC_LIMIT: ${KOSCOM_MISSING_BASE_PRICE_SYNC_LIMIT:-60}
      DB_SYNC_SCHEMA: ${DB_SYNC_SCHEMA:-true}
      DB_SYNC_ALTER: ${DB_SYNC_ALTER:-false}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    profiles:
      - was
